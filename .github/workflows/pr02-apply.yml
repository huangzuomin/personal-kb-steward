name: PR02 patch validation

on:
  push:
    branches: ["agent/stable-knowledge-object"]
    paths:
      - ".github/pr02.payload.*"
      - ".github/workflows/pr02-apply.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Apply exact locally reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import os
          from pathlib import Path
          raw = b''.join(Path(f'.github/pr02.payload.{i}').read_bytes() for i in range(3))
          patch = gzip.decompress(raw)
          expected = 'fdf47d8d9f414de159b5e69ab2ecd93791e26f270cc7322e27faf6be173fdbd8'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'pr02.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/pr02.patch"
          git apply "$RUNNER_TEMP/pr02.patch"
      - run: python -m pip install -r requirements.txt
      - name: Validate and test
        run: |
          cp config.example.json config.json
          python scripts/validate_config.py
          python -m compileall -q core scripts tests
          git diff --check
          python -m pytest -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stable-knowledge-object
      - name: Refuse concurrent branch changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Apply verified patch
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import os
          from pathlib import Path
          raw = b''.join(Path(f'.github/pr02.payload.{i}').read_bytes() for i in range(3))
          patch = gzip.decompress(raw)
          expected = 'fdf47d8d9f414de159b5e69ab2ecd93791e26f270cc7322e27faf6be173fdbd8'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'pr02.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/pr02.patch"
          git apply "$RUNNER_TEMP/pr02.patch"
      - name: Commit only PR02 implementation
        run: |
          git add -- AGENTS.md README.md core/knowledge_objects.py core/plan_objects.py core/vault.py docs/stable-knowledge-objects.md scripts/personal_kb_steward.py tests/test_knowledge_objects.py tests/test_object_plans.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add stable knowledge objects and guarded identity plans'
          git push origin HEAD:refs/heads/agent/stable-knowledge-object
