name: Issue16 source snapshot
on:
  push:
    branches: ["fix/seed-quality-and-output-paths"]
    paths: [".github/workflows/issue16-source.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f05e7d1b9eb769e1ba485a55f786f06646e89163
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact tracked baseline
        run: git bundle create "$RUNNER_TEMP/issue16-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue16-source
          path: ${{ runner.temp }}/issue16-source.bundle
          retention-days: 1
