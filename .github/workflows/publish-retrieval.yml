name: Validate and publish retrieval patch
on:
  push:
    branches: ["transport/retrieval-source"]
    paths: [".github/retrieval.payload.*", ".github/workflows/publish-retrieval.yml"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact locally tested patch
        shell: python
        run: |
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/retrieval.payload.{i}').read_text(encoding='utf-8') for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd807d7ef2d7c5711092c93e2e50db35c3eb447328488248630036f2da60fe4b1'
          (Path(os.environ['RUNNER_TEMP']) / 'retrieval.patch').write_bytes(patch)
      - name: Apply only to unchanged feature branch
        run: |
          git fetch origin agent/retrieval-integration
          test "$(git rev-parse origin/agent/retrieval-integration)" = facd92d4dc2dcfb82676873bd0f94059e54f574b
          git checkout -B agent/retrieval-integration origin/agent/retrieval-integration
          git apply --check "$RUNNER_TEMP/retrieval.patch"
          git apply --index "$RUNNER_TEMP/retrieval.patch"
          test "$(git write-tree)" = 95f8f9531686a2d12cbc7455246f7a4370df39e3
          git diff --cached --check
      - run: python -m pip install -r requirements.txt
      - name: Validate before publication
        shell: python
        run: |
          import shutil, subprocess, sys
          from pathlib import Path
          assert not Path('config.json').exists()
          subprocess.run([sys.executable, '-m', 'compileall', '-q', 'core', 'scripts', 'tests'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q'], check=True)
          assert not Path('config.json').exists()
          shutil.copyfile('config.example.json', 'config.json')
          subprocess.run([sys.executable, 'scripts/validate_config.py'], check=True)
          Path('config.json').unlink()
      - name: Commit and push verified feature tree
        run: |
          test "$(git write-tree)" = 95f8f9531686a2d12cbc7455246f7a4370df39e3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate source-aware retrieval into Agent workflows'
          git push origin HEAD:refs/heads/agent/retrieval-integration
