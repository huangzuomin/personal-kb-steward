name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive tracked source for reproducibility
        if: matrix.python-version == '3.11'
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/steward-source.tar"

      - name: Retain source snapshot
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: steward-source-${{ github.sha }}
          path: ${{ runner.temp }}/steward-source.tar
          retention-days: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare local config
        run: cp config.example.json config.json

      - name: Validate configuration
        run: python scripts/validate_config.py

      - name: Run tests
        run: python -m pytest -q
