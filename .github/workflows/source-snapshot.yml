name: Isolated baseline snapshot
on:
  push:
    branches: [transport/reconcile-source]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c54139c85100aa0e04d096b7b391dcacc177ca86
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked Git objects
        run: git bundle create "$RUNNER_TEMP/steward-source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: steward-baseline-c54139c
          path: ${{ runner.temp }}/steward-source.bundle
          retention-days: 1
