name: Isolated SQLite source
on:
  push:
    branches: ["transport/sqlite-source"]
    paths: [".github/workflows/source-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87b05a4333906c14f10ce6c17e1e0a48ec3fe4b2
          persist-credentials: false
      - run: git archive --format=tar HEAD -o "$RUNNER_TEMP/steward-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: steward-source-87b05a4
          path: ${{ runner.temp }}/steward-source.tar
          retention-days: 1
