name: Isolated synthesis source
on:
  push:
    branches: ["transport/synthesis-source"]
    paths: [".github/workflows/source-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 466fed168ac441e1da3f7ae7e8ee0d70cdbd76fc
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create "$RUNNER_TEMP/steward-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: steward-source-466fed16
          path: ${{ runner.temp }}/steward-source.bundle
          retention-days: 1
