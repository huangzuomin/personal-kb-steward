name: Isolated dependency source
on:
  push:
    branches: ["transport/dependency-source"]
    paths: [".github/workflows/source-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 550e9896e673f0a876c0b21f662aa56f40841e81
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create "$RUNNER_TEMP/steward-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: steward-source-550e9896
          path: ${{ runner.temp }}/steward-source.bundle
          retention-days: 1
