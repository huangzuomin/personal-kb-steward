name: Review PR5 patch validation

on:
  push:
    branches: ["agent/stable-knowledge-object"]
    paths: [".github/review-pr5.payload.*", ".github/workflows/review-pr5-apply.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Apply checksum-verified review patch
        shell: python
        run: |
          import gzip, hashlib, os, subprocess
          from pathlib import Path
          data = gzip.decompress(b''.join(Path(f'.github/review-pr5.payload.{i}').read_bytes() for i in range(5)))
          assert hashlib.sha256(data).hexdigest() == '56d3c5fdcb32460eecb2523516f6f8c8d78c01f684f2c21255664e3183ea1888'
          path = Path(os.environ['RUNNER_TEMP']) / 'review.patch'
          path.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
      - run: python -m pip install -r requirements.txt
      - name: Validate exact patch without local configuration
        run: |
          python -m compileall -q core scripts tests
          git diff --check
          python -c "from pathlib import Path; assert not Path('config.json').exists()"
          python -m pytest -q
          python -c "from pathlib import Path; assert not Path('config.json').exists()"
          python -c "import shutil; shutil.copyfile('config.example.json', 'config.json')"
          python scripts/validate_config.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stable-knowledge-object
      - name: Refuse concurrent branch changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Apply verified patch
        shell: python
        run: |
          import gzip, hashlib, os, subprocess
          from pathlib import Path
          data = gzip.decompress(b''.join(Path(f'.github/review-pr5.payload.{i}').read_bytes() for i in range(5)))
          assert hashlib.sha256(data).hexdigest() == '56d3c5fdcb32460eecb2523516f6f8c8d78c01f684f2c21255664e3183ea1888'
          path = Path(os.environ['RUNNER_TEMP']) / 'review.patch'
          path.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
      - name: Commit only reviewed implementation
        run: |
          git add -- README.md core/finalizer.py core/plan_objects.py core/run_records.py core/safety.py docs/stable-knowledge-objects.md scripts/personal_kb_steward.py tests/test_object_plans.py tests/test_producer_recovery.py tests/test_run_recovery.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve run audit history and generation-time update baselines'
          git push origin HEAD:refs/heads/agent/stable-knowledge-object
